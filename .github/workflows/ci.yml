name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: echo "list=$(ls */go.mod | xargs -n1 dirname | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    env:
      GOPRIVATE: github.com/weakpixel/engine
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The engine repository is private for now: ENGINE_TOKEN is a token
      # with read access to weakpixel/engine. Drop this step when it is public.
      - name: access to the engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        if: env.ENGINE_TOKEN != ''
        run: git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/weakpixel/engine".insteadOf "https://github.com/weakpixel/engine"
      - name: make all
        run: make all
      - name: generate and gofmt left no changes
        run: git diff --exit-code
      - name: make wasm-test
        run: make wasm-test
