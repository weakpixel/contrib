name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "*/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: make all
        run: make all
      - name: gofmt and generate left no changes
        run: git diff --exit-code
      - name: make wasm-test
        run: make wasm-test
